# ════════════════════════════════════════════════════════════════════
#  pica-server —— 飞牛 NAS / Docker Compose 部署
#
#  用法：
#    1. cp .env.example .env   # 然后改掉 PICA_AUTH_TOKEN
#    2. docker compose up -d --build
#    3. 浏览器打开 http://<NAS IP>:8080
#
#  常用命令：
#    docker compose logs -f          # 看实时日志
#    docker compose up -d --build    # 改代码后重建
#    docker compose down             # 停止（数据卷保留）
# ════════════════════════════════════════════════════════════════════

services:
  pica-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期代理：国内直连 npm registry / crates.io 通常不通，
        # 构建会卡在拉依赖。在 .env 里填宿主机代理地址即可，例如：
        #     BUILD_HTTP_PROXY=http://192.168.31.124:7890
        # 注意必须用宿主机的局域网 IP，不能用 127.0.0.1
        # （构建容器里的 127.0.0.1 指向容器自己，不是宿主机）。
        # 留空则不加代理，按直连处理。
        # 这两个变量只作用于构建，不会进入运行期容器（见 Dockerfile runtime 阶段）。
        HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
        HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-}"
    image: pica-server:latest
    container_name: pica-server

    # unless-stopped：NAS 重启后自动拉起，手动 stop 的则保持停止
    restart: unless-stopped

    ports:
      # 左边是 NAS 上对外暴露的端口，被占用就改成别的（如 18080）
      - "${PICA_HOST_PORT:-8080}:8080"

    environment:
      # ── 认证 ──────────────────────────────────────────────────────
      # 首次留空会自动生成随机 Token，并在 `docker compose logs` 里
      # 打印一次；想固定下来就把生成的值填进 .env。
      PICA_AUTH_TOKEN: "${PICA_AUTH_TOKEN:-}"
      PICA_AUTH_USER: "${PICA_AUTH_USER:-admin}"
      PICA_AUTH_DISABLED: "${PICA_AUTH_DISABLED:-false}"

      # ── 服务 ──────────────────────────────────────────────────────
      PICA_BIND: "0.0.0.0"
      PICA_PORT: "8080"
      TZ: "${TZ:-Asia/Shanghai}"

      # ── 运行期代理（可选，但国内几乎必填）─────────────────────────
      # 与上面的 BUILD_*_PROXY 是两回事：那两个只作用于构建，这两个只
      # 作用于运行期。
      #
      # 什么时候需要：如果 NAS 直连哔咔 API（picaapi.picacomic.com）和
      # 图片 CDN 不通，就必须在这里配代理，否则网页能打开、能登录，
      # 但点下载会一直转圈或全部超时。
      #
      # 自测方法（在 NAS 上执行）：
      #   curl -sS -o /dev/null -w '%{http_code}\n' https://picaapi.picacomic.com/
      #     无输出/超时 = 直连不通，需要配代理
      #     返回 400    = 通了（400 是哔咔对无签名请求的正常拒绝）
      #
      # 填宿主机代理地址。推荐用 host.docker.internal —— 下面的
      # extra_hosts 已把它映射到宿主机，换 NAS 或改 IP 时不用动配置。
      # 也可以直接写 NAS 的局域网 IP。
      #
      # ⚠ 不能写 127.0.0.1：容器里的 127.0.0.1 指向容器自身，不是宿主机。
      #
      # 留空 = 直连。
      HTTP_PROXY: "${PICA_HTTP_PROXY:-}"
      HTTPS_PROXY: "${PICA_HTTPS_PROXY:-}"
      http_proxy: "${PICA_HTTP_PROXY:-}"
      https_proxy: "${PICA_HTTPS_PROXY:-}"

    # 让容器内可以用 host.docker.internal 指向宿主机，
    # 这样代理地址写成 http://host.docker.internal:7890 即可，
    # 不必把 NAS 的局域网 IP 硬编码进 .env。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 配置 / 日志在容器内 /data 下。
      # 强烈建议绑到 NAS 的存储池（而不是默认的 docker 卷），
      # 这样日志是普通文件，方便快照、备份和直接读。
      - "${PICA_DATA_PATH:-./data}:/data"

      # ── 漫画下载目录 ───────────────────────────────────────────────
      # 单独挂载，让下载产物直接落进后处理流水线（pica_postprocess.py）
      # 扫描的源目录，实现「下载 → 打包 CBZ → 上传 115」全自动。
      #
      # 需要把 config.json 里的 downloadDir 改成 /comic-download
      # （首次启动后改，或在网页「配置」里改）。
      #
      # 留空/注释掉则沿用 /data/漫画下载（不接后处理流水线）。
      - "${PICA_COMIC_PATH:-./comic-download}:/comic-download"

    # 下载是 IO + 网络密集型，给足并发文件描述符
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 让容器内的日志（含自动生成的 Token）不被 docker 截断
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3